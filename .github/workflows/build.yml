# Version (a): repository on GitHub, published with GitHub Pages.
# Builds on every change, every night (so passed dates move on) and on demand.
# Settings › Pages › Source: "GitHub Actions". Settings › Secrets and variables › Actions › Variables:
#   DECAP_OAUTH_URL  address of the login service (deploy/github-login), for the editor at /admin/
#   SITE_URL         optional, e.g. https://osi-luebeck.de when a custom domain is used
name: Build and publish
on:
  push: { branches: [main] }
  schedule: [{ cron: "15 2 * * *" }]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - name: Build
        run: npx @11ty/eleventy
        env:
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/
          DECAP_OAUTH_URL: ${{ vars.DECAP_OAUTH_URL }}
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
