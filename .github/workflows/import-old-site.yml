# One-off: copies all news of the old WordPress website, with their pictures, into content/.
# Start it under Actions › "Import news from the old website" › Run workflow.
# News that already exist are left alone, so running it twice does no harm.
name: Import news from the old website
on:
  workflow_dispatch:
    inputs:
      site:
        description: "Address of the old website"
        required: true
        default: "https://osi-luebeck.de"
permissions: { contents: write, actions: write }
concurrency: { group: import, cancel-in-progress: false }
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Import
        run: node tools/import-wordpress.js "$OLD_SITE"
        env:
          OLD_SITE: ${{ inputs.site }}
      - name: Save and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/news content/uploads
          if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
          git commit -m "Import news from the old website"
          git push
          gh workflow run build.yml --ref "$GITHUB_REF_NAME"
