# nginx: serve the folder _site.
server {
    listen 443 ssl;
    server_name osi-luebeck.de;
    root /var/www/osi-site;          # the content of _site
    index index.html;
    error_page 404 /404.html;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / { try_files $uri $uri/ =404; }

    location /admin/ {
        # The editing interface brings its own security rule in admin/index.html (it depends on the Git host).
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ =404;
    }
}
